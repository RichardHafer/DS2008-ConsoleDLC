; Dead Space 2008 Randomizer: Console DLC 1.0.1, settings for playing without the randomizer.
; With the randomizer (1.0.2 or later) installed this file is not read; the same keys go into
; DeadSpace2008Randomizer.ini.

[DeadSpace2008Randomizer]
; The console DLC suits and weapons in the store, free.
ConsoleDlc=1
; Size of the suit table. The game holds 30; the DLC and the level suits in DLC style need more.
SuitSlots=64
; Loaded sound banks. The game holds 35; the DLC weapons bring their own banks.
SoundBankSlots=96
; The RIG health and stasis bars of the DLC and DLC style suits in a colour per style (experimental).
; The first start after a change writes recoloured copies of those suits (<suit>_rig.str).
RigColours=0
; R,G,B from 0 to 255, or off to keep the teal. Red and yellow at low health stay.
RigColour_Scorpion=255,170,40
RigColour_Obsidian=60,140,255
RigColour_Unitology=100,125,255
RigColour_Elite=84,231,0
RigColour_Astronaut=235,240,255
RigColour_Military=25,70,200
